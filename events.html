<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — Central Baptist Church</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Lightbox */
    #vbs-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #vbs-lightbox.open {
      display: flex;
    }
    .vbs-lightbox-inner {
      position: relative;
      width: 100%;
      max-width: 800px;
    }
    .vbs-lightbox-inner .vbs-video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
    }
    .vbs-lightbox-inner .vbs-video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      border-radius: 10px;
    }
    .vbs-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }
    .vbs-close:hover { color: #c9a84c; }
  </style>
</head>
<body>

  <div id="header-placeholder"></div>

  <!-- Hero -->
  <section class="hero" style="min-height: 250px; padding: 60px 30px;">
    <h2>Events</h2>
    <p>Stay connected with what's happening at Central Baptist Church</p>
  </section>

  <!-- Upcoming Events -->
  <section class="section" style="max-width: 800px;">
    <h3>Upcoming Events</h3>
    <hr class="section-divider" />

    <!-- No current events -->
    <div style="text-align: center; padding: 60px 30px; color: #888;">
      <div style="font-size: 3rem; margin-bottom: 16px;">📅</div>
      <p style="font-size: 1rem; color: #666;">No upcoming events at this time. Check back soon!</p>
      <p style="margin-top: 12px; font-size: 0.9rem;">
        For information about what's happening at CBC, 
        <a href="contact.html" style="color: #c9a84c; font-weight: bold;">contact us</a> 
        or call <a href="tel:+12567641522" style="color: #c9a84c; font-weight: bold;">(256) 764-1522</a>.
      </p>
    </div>

  </section>

  <!-- Video Lightbox -->
  <div id="vbs-lightbox">
    <div class="vbs-lightbox-inner">
      <button class="vbs-close" id="vbs-close" aria-label="Close video">✕</button>
      <div class="vbs-video-wrap">
        <iframe
          id="vbs-iframe"
          src=""
          title="Kingdom Quest VBS Preview"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="includes.js"></script>
  <script>
    var vbsTrigger = document.getElementById('vbs-trigger');
    var vbsLightbox = document.getElementById('vbs-lightbox');
    var vbsClose = document.getElementById('vbs-close');
    var vbsIframe = document.getElementById('vbs-iframe');
    var VBS_VIDEO = 'https://www.youtube.com/embed/ySUElMGSUJ0?autoplay=1';

    vbsTrigger.addEventListener('click', function () {
      vbsIframe.src = VBS_VIDEO;
      vbsLightbox.classList.add('open');
    });

    function closeLightbox() {
      vbsLightbox.classList.remove('open');
      vbsIframe.src = '';
    }

    vbsClose.addEventListener('click', closeLightbox);
    vbsLightbox.addEventListener('click', function (e) {
      if (e.target === vbsLightbox) closeLightbox();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
